name: iOS build

on:
  push:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Build iOS simulator app
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate --spec project.yml

      - name: Build without signing
        working-directory: ios-app
        run: >-
          xcodebuild build
          -project OPSUCHTMarket.xcodeproj
          -scheme OPSUCHTMarket
          -sdk iphonesimulator
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          -derivedDataPath build/simulator

      - name: Package simulator app
        working-directory: ios-app
        run: ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Debug-iphonesimulator/OPSUCHTMarket.app OPSUCHTMarket-simulator.zip

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPSUCHTMarket-iOS-simulator
          path: ios-app/OPSUCHTMarket-simulator.zip
          if-no-files-found: error

  # Enable this job only after adding Apple signing material. It is skipped by
  # default, so the public simulator build never needs certificates or a team.
  signed:
    name: Build signed IPA (optional)
    if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
    runs-on: macos-14
    env:
      IOS_BUNDLE_ID: net.opsucht.radar.ios
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_TEAM_ID"
          CERT="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE")")
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate --spec project.yml

      - name: Archive signed app
        working-directory: ios-app
        run: >-
          xcodebuild archive
          -project OPSUCHTMarket.xcodeproj
          -scheme OPSUCHTMarket
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/OPSUCHTMarket.xcarchive
          DEVELOPMENT_TEAM="$IOS_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        working-directory: ios-app
        env:
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/OPSUCHTMarket.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: OPSUCHTMarket-iOS-signed
          path: ios-app/build/export/*.ipa
          if-no-files-found: error
