name: Build and publish release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandenen Release-Tag erneut bauen (z. B. v1.0.6)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Manual reruns must build the requested tag, not the default branch.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android APK
        working-directory: android-app
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiger Release-Tag: ${release_tag}" >&2
            exit 1
          fi
          cp android-app/app/build/outputs/apk/release/app-release.apk "release-assets/OPSUCHT-Market-${release_tag}.apk"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
          git archive --format=zip --prefix="opsucht-market-server-${release_tag}/" HEAD \
            ':!android-app/.gradle' ':!data' ':!work' ':!releases' > "release-assets/opsucht-market-server-${release_tag}.zip"
          git archive --format=zip --prefix="opsucht-market-ios-${release_tag}/" HEAD:ios-app \
            > "release-assets/opsucht-market-ios-${release_tag}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
