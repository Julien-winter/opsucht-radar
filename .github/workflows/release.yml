name: Build and publish release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandenen Release-Tag erneut bauen (z. B. v1.0.6)"
        required: true
        type: string
      source_ref:
        description: "Quell-Branch oder Commit für den Build"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Manual reruns must build the requested tag, not the default branch.
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure permanent release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OPSUCHT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPSUCHT_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_KEYSTORE_BASE64 (einmalig im Repository hinterlegen)" >&2; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_STORE_PASSWORD" >&2; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_KEY_ALIAS" >&2; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opsucht-release.jks"
          test -s "$RUNNER_TEMP/opsucht-release.jks"

      - name: Build Android APK
        working-directory: android-app
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.OPSUCHT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_KEY_PASSWORD }}
        run: >-
          bash ./gradlew assembleRelease --no-daemon
          -PreleaseStoreFile="$RUNNER_TEMP/opsucht-release.jks"
          -PreleaseStorePassword="$RELEASE_STORE_PASSWORD"
          -PreleaseKeyAlias="$RELEASE_KEY_ALIAS"
          -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiger Release-Tag: ${release_tag}" >&2
            exit 1
          fi
          cp android-app/app/build/outputs/apk/release/app-release.apk "release-assets/OPSUCHT-Market-${release_tag}.apk"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: OPSUCHT Market ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
