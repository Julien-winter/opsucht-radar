name: Build and publish release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandenen Release-Tag erneut bauen (z. B. v1.0.6)"
        required: true
        type: string
      source_ref:
        description: "Quell-Branch oder Commit für den Build"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Manual reruns must build the requested tag, not the default branch.
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure permanent release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.OPSUCHT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPSUCHT_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_KEYSTORE_BASE64 (einmalig im Repository hinterlegen)" >&2; exit 1; }
          [[ -n "$STORE_PASSWORD" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_STORE_PASSWORD" >&2; exit 1; }
          [[ -n "$KEY_ALIAS" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_KEY_ALIAS" >&2; exit 1; }
          [[ -n "$KEY_PASSWORD" ]] || { echo "Fehlendes GitHub-Secret: OPSUCHT_RELEASE_KEY_PASSWORD" >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opsucht-release.jks"
          test -s "$RUNNER_TEMP/opsucht-release.jks"

      - name: Build Android APK
        working-directory: android-app
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.OPSUCHT_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.OPSUCHT_RELEASE_KEY_PASSWORD }}
        run: >-
          bash ./gradlew assembleRelease --no-daemon
          -PreleaseStoreFile="$RUNNER_TEMP/opsucht-release.jks"
          -PreleaseStorePassword="$RELEASE_STORE_PASSWORD"
          -PreleaseKeyAlias="$RELEASE_KEY_ALIAS"
          -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.release_tag }}"
          fi
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungültiger Release-Tag: ${release_tag}" >&2
            exit 1
          fi
          # Do not silently publish an APK whose internal version differs from
          # the tag. This is especially useful when a release is rebuilt from
          # an older source ref.
          version_name="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" android-app/app/build.gradle | head -n 1)"
          expected_version="${release_tag#v}"
          [[ "$version_name" == "$expected_version" ]] || {
            echo "Version stimmt nicht mit dem Tag überein: build=$version_name tag=$expected_version" >&2
            exit 1
          }
          cp android-app/app/build/outputs/apk/release/app-release.apk "release-assets/OPSUCHT-Market-${release_tag}.apk"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
          # Keep release pages readable: publish only the matching changelog
          # section instead of repeating the complete history every time.
          awk -v wanted="## ${release_tag#v}" '
            $0 == wanted { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-assets/RELEASE_NOTES.md
          if [[ ! -s release-assets/RELEASE_NOTES.md ]]; then
            echo "Kein Changelog-Abschnitt für ${release_tag} gefunden" >&2
            exit 1
          fi
          # Prevent accidental source archives, databases or signing material
          # from becoming release assets.
          find release-assets -type f ! -name '*.apk' ! -name 'SHA256SUMS.txt' ! -name 'RELEASE_NOTES.md' -delete

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: OPSUCHT Market ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
