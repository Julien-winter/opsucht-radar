name: Build and publish release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android APK
        working-directory: android-app
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp android-app/app/build/outputs/apk/release/app-release.apk "release-assets/OPSUCHT-Market-${GITHUB_REF_NAME}.apk"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt
          git archive --format=zip --prefix="opsucht-market-${GITHUB_REF_NAME}/" HEAD \
            ':!android-app/.gradle' ':!data' ':!work' ':!releases' > "release-assets/opsucht-market-server-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
